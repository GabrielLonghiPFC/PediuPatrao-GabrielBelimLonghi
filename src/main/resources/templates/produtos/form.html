<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Produto</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/produtos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Editar Produto</h2>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm" style="max-width: 600px;">
        <div class="card-body p-4">
            <form th:action="@{/produtos/editar/{id}(id=${produto.id})}" th:object="${produto}" method="post">
                <input type="hidden" th:field="*{id}"/>

                <div class="mb-3">
                    <label for="nome" class="form-label fw-medium">Nome</label>
                    <input type="text" id="nome" class="form-control" th:field="*{nome}" required>
                </div>

                <div class="mb-3">
                    <label for="tipo" class="form-label fw-medium">Tipo</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}" required>
                        <option value="" disabled>Selecione o tipo</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="preco" class="form-label fw-medium">Preço (R$)</label>
                    <input type="number" id="preco" class="form-control" th:field="*{preco}" step="0.01" min="0" required>
                </div>

                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="ativo" th:field="*{ativo}">
                    <label class="form-check-label" for="ativo">Produto ativo</label>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a href="/produtos" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</div>

</body>
</html>
