<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Gerenciar Produtos</title>
    </head>
    <body>

        <div class="container mt-5" th:fragment="content">
            <h1 class="mb-4">Gestão de Produtos</h1>

            <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
                <span th:text="${sucesso}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
                <span th:text="${erro}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <button class="btn btn-primary mb-3" type="button" data-bs-toggle="collapse" data-bs-target="#formularioProduto">
                Novo Produto
            </button>

            <div class="collapse" id="formularioProduto">
                <div class="card card-body">
                    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome do Produto</label>
                            <input type="text" id="nome" class="form-control" th:field="*{nome}" placeholder="Nome do Produto" required>
                        </div>

                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo do Produto</label>
                            <select id="tipo" class="form-select" th:field="*{tipo}" required>
                                <option value="" disabled selected>Selecione o Tipo</option>
                                <option value="Pizza">Pizza</option>
                                <option value="Lanche">Lanche</option>
                                <option value="Bebida">Bebida</option>
                                <option value="Porção">Porção</option>
                                <option value="Adicional">Adicional</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="preco" class="form-label">Preço</label>
                            <input type="number" id="preco" class="form-control" th:field="*{preco}" placeholder="Preço (R$)" step="0.01" min="0" required>
                        </div>

                        <div class="form-check mb-3">
                            <input type="checkbox" id="ativo" class="form-check-input" th:field="*{ativo}">
                            <label for="ativo" class="form-check-label">Produto Ativo</label>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="submit" class="btn btn-success">Salvar</button>
                        </div>
                    </form>
                </div>
            </div>

            <table class="table table-bordered table-striped mt-3">
                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="produto : ${produtos}">
                        <td th:text="${produto.id}"></td>
                        <td th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${#numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT')}"></td>
                        <td th:text="${produto.ativo != null and produto.ativo} ? 'Sim' : 'Não'">Sim</td>
                        <td>
                            <a th:href="@{/produtos/editar/{id}(id=${produto.id})}" class="btn btn-warning btn-sm">Editar</a>
                            <form th:action="@{/produtos/excluir/{id}(id=${produto.id})}" method="post" class="d-inline">
                                <button type="submit" class="btn btn-danger btn-sm"
                                        onclick="return confirm('Tem certeza que deseja excluir este produto?');">
                                    Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

    </body>
</html>
