<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a sec:authorize="hasAnyRole('GERENTE','ATENDENTE')" href="/pedidos/novo" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente</th>
                        <th>Responsável</th>
                        <th>Entrada</th>
                        <th>Itens</th>
                        <th>Total</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${paginaPedidos.totalElements == 0}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${paginaPedidos.content}">
                        <td class="ps-4">
                            <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="text-decoration-none" th:text="${pedido.id}"></a>
                        </td>
                        <td th:text="${nomesClientes[pedido.clienteId]} ?: pedido.clienteId"></td>
                        <td th:text="${pedido.responsavelRegistro}"></td>
                        <td th:text="${pedido.dataHoraEntrada != null ? #temporals.format(pedido.dataHoraEntrada, 'dd/MM/yyyy HH:mm') : '—'}"></td>
                        <td th:text="${pedido.itens != null ? #lists.size(pedido.itens) : 0}"></td>
                        <td th:text="${pedido.valorTotal != null ? #numbers.formatDecimal(pedido.valorTotal, 1, 'COMMA', 2, 'POINT') : '—'}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'ENTREGUE' or pedido.status == 'FINALIZADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO' or pedido.status == 'EM_PREPARACAO'} ? 'bg-warning text-dark' :
                                                  (${pedido.status == 'PRONTO'} ? 'bg-info text-dark' : 'bg-secondary')))"
                                  th:text="${#strings.replace(pedido.status, '_', ' ')}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex flex-wrap justify-content-between align-items-center gap-2 small"
             th:if="${paginaPedidos.totalElements > 0}">
            <span class="text-muted">
                Página <strong th:text="${paginaPedidos.number + 1}"></strong> de
                <strong th:text="${paginaPedidos.totalPages}"></strong>
                (<span th:text="${paginaPedidos.totalElements}"></span> pedido(s))
            </span>
            <nav>
                <ul class="pagination pagination-sm mb-0">
                    <li class="page-item" th:classappend="${paginaPedidos.first} ? 'disabled'">
                        <a class="page-link" th:href="@{/pedidos(pagina=${paginaPedidos.number - 1})}">Anterior</a>
                    </li>
                    <li class="page-item"
                        th:each="i : ${#numbers.sequence(T(java.lang.Math).max(0, paginaPedidos.number - 2), T(java.lang.Math).min(paginaPedidos.totalPages - 1, paginaPedidos.number + 2))}"
                        th:classappend="${i == paginaPedidos.number} ? 'active'">
                        <a class="page-link" th:href="@{/pedidos(pagina=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${paginaPedidos.last} ? 'disabled'">
                        <a class="page-link" th:href="@{/pedidos(pagina=${paginaPedidos.number + 1})}">Próxima</a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>

</div>

</body>
</html>
